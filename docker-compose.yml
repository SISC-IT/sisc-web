services:
  db:
    image: postgres:16-alpine
    container_name: db
    ports:
      - "127.0.0.1:5432:5432"  # 외부 인터넷은 차단되고 서버 내부에서만 접속 가능
    environment:
      POSTGRES_DB: sisc_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./data/postgres:/var/lib/postgresql/data              # [SSD] 기본 DB 데이터 (엔진, 메인 테이블)
      - /mnt/storage/pg_ai_data:/var/lib/postgresql/ai_data   # [HDD] AI 전용 테이블스페이스 공간 (HDD 경로로 매핑)
    networks:
      - sisc-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G    # AI 쿼리 고려해서 1GB 권장
        reservations:
          memory: 256M

  # 백엔드 (Spring Boot)
  api:
    image: ghcr.io/sisc-it/sisc-web-back:${TAG:-latest} # TAG 변수가 없으면 latest 사용
    container_name: api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul                   # 시간대 설정 : 컨테이너 내부 환경변수
      - JAVA_OPTS=-Xmx2G -Xms1G -XX:+UseG1GC -XX:MaxGCPauseMillis=200     # 자바 힙 메모리를 1GB ~ 2GB로 확장 (8GB 서버 기준)
    volumes:
      - /etc/localtime:/etc/localtime:ro  # 시간대 설정 : 호스트의 시간 설정 파일 공유
      - /etc/timezone:/etc/timezone:ro
      - /mnt/storage/logs:/app/logs       # 로그 파일 저장 경로 hdd로 마운트
      - /mnt/storage/uploads:/app/uploads # 업로드된 파일 저장 경로 hdd로 마운트
    networks:
      - sisc-net
    depends_on: # redis, db 컨테이너가 켜진 후에 api 실행됨
      - redis
      - db
    deploy:
      resources:
        limits:
          memory: 3G                 # JVM 힙 외 여유 공간 포함 3GB 할당
        reservations:
          memory: 1G                 # 최소 1GB 보장
  redis:
    image: redis:alpine  # 가벼운 alpine 버전 사용
    container_name: redis
    restart: always
    command: redis-server --maxmemory 180mb --maxmemory-policy allkeys-lru
    networks:
      - sisc-net
    deploy:
      resources:
        limits:
          memory: 250M

  # 프론트엔드 (React)
  web:
    image: ghcr.io/sisc-it/sisc-web-front:${TAG:-latest}
    container_name: web
    restart: always
    #ports: # NGINX로 인해 주석 처리
      # - "80:80"     # HTTP
      # - "443:443" # HTTPS (인증서 설정 필요 시 주석 해제)
    networks:
      - sisc-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. AI
  #ai:
  #  image: ghcr.io/sisc-it/sisc-web-xai:${TAG:-latest}
  #  container_name: ai
  #  restart: always
  #  ports:
  #    - "5000:5000"
  #  environment:
  #    - AI_MODEL_WEIGHTS_DIR=/mnt/ai-artifacts
  #  volumes:
  #    - /mnt/storage/ai-artifacts:/mnt/ai-artifacts
  #  networks:
  #    - sisc-net
  #  deploy:
  #    resources:
  #      limits:
  #        memory: 2G                 # AI 모델 로드 시 필요한 메모리 확보
  #      reservations:
  #        memory: 512M
  # SEC EDGAR one-shot job. 최초 5년 백필은 --start 2021-01-01로 수동 실행하고,
  # 정기 실행은 최근 7일을 재수집해 지연·정정 공시를 멱등 반영합니다.
  ai-sec:
    profiles: ["jobs"]
    image: ghcr.io/sisc-it/sisc-web-xai:${TAG:-latest}
    env_file:
      - .env
    environment:
      - TZ=UTC
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sisc_db
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SEC_USER_AGENT=${SEC_USER_AGENT}
    volumes:
      - /mnt/storage/sec-edgar:/mnt/sec-edgar
    command:
      - python
      - AI/modules/data_collector/scripts/collect_sec_edgar.py
      - --universe-file
      - AI/modules/data_collector/config/sp100_companies.json
      - --lookback-days
      - "7"
      - --storage
      - both
      - --data-dir
      - /mnt/sec-edgar/storage
      - --cache-dir
      - /mnt/sec-edgar/cache
      - --log-dir
      - /mnt/sec-edgar/logs
      - --recent-only
    networks:
      - sisc-net
    depends_on:
      - db
    restart: "no"

  # One-shot company news collection job. Run from cron/systemd with:
  # docker compose --profile jobs run --rm ai-news
  ai-news:
    profiles: ["jobs"]
    image: ghcr.io/sisc-it/sisc-web-xai:${TAG:-latest}
    env_file:
      - .env
    environment:
      - TZ=UTC
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sisc_db
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    command:
      - python
      - AI/modules/data_collector/scripts/collect_company_news.py
      - --lookback-hours
      - "2"
      - --persist
    networks:
      - sisc-net
    depends_on:
      - db
    restart: "no"

  # Import SEC filings and reconcile event-news links until accepted_at + 48h.
  ai-event-news:
    profiles: ["jobs"]
    image: ghcr.io/sisc-it/sisc-web-xai:${TAG:-latest}
    env_file:
      - .env
    environment:
      - TZ=UTC
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sisc_db
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    command:
      - python
      - AI/modules/data_collector/scripts/link_event_news.py
      - --sync-sec-filings
      - --limit
      - "100"
    networks:
      - sisc-net
    depends_on:
      - db
    restart: "no"

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      # 외부망(공유기)에서 들어오는 80, 443 요청을 NPM이 모두 받음
      - '80:80'
      - '443:443'
      - '81:81' # NPM 관리자 페이지 (접속: http://서버IP:81)
    volumes:
      - ./data/npm:/data               # NPM 설정 데이터 유지
      - ./data/letsencrypt:/etc/letsencrypt # SSL 인증서 데이터 유지
      - /mnt/storage/uploads:/app/uploads:ro  # Nginx도 파일을 읽을 수 있게 연결 (읽기전용 :ro)
    networks:
      - sisc-net
    deploy:
      resources:
        limits:
          memory: 512M
networks:
  sisc-net:
    driver: bridge
